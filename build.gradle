plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version "${serenityGradleVersion}"
}

subprojects {
    apply plugin: 'java'
    group = 'com.reto.automation'
    version = '1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    compileJava.options.encoding = 'UTF-8'
    compileTestJava.options.encoding = 'UTF-8'

    tasks.withType(Test).configureEach {
        defaultCharacterEncoding = 'UTF-8'
    }

    dependencies {
        implementation "net.serenity-bdd:serenity-core:${serenityCoreVersion}"
        implementation "net.serenity-bdd:serenity-cucumber:${serenityCoreVersion}"
        implementation "net.serenity-bdd:serenity-playwright:${serenityCoreVersion}"
        testImplementation "net.serenity-bdd:serenity-junit5:${serenityCoreVersion}"
        testImplementation "net.serenity-bdd:serenity-ensure:${serenityCoreVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
        testImplementation "org.junit.vintage:junit-vintage-engine:5.10.2"
        testImplementation "org.junit.platform:junit-platform-suite-api:1.10.2"
        testImplementation "org.junit.platform:junit-platform-suite-engine:1.10.2"
        testImplementation "io.cucumber:cucumber-junit-platform-engine:7.34.2"
        testImplementation "org.assertj:assertj-core:${assertJVersion}"
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }

    test {
        useJUnitPlatform()
        // Ambos módulos (api-tests, ui-tests) escriben su evidencia cruda de
        // Serenity en la MISMA carpeta compartida del proyecto raíz, en vez
        // de cada uno en su propio target/site/serenity/. Así, al agregar,
        // se compila un único reporte combinado con los escenarios de ambos.
        systemProperty 'serenity.outputDirectory', "${rootDir}/target/site/serenity"
        // El plugin de Serenity solo está aplicado en el proyecto raíz (ver
        // arriba), donde vive la tarea "aggregate" real. Cada módulo la
        // dispara al terminar sus tests; Gradle deduplica: si se corren
        // ambos en la misma invocación (./gradlew test), "aggregate" corre
        // una sola vez, después de que TERMINEN los dos.
        finalizedBy rootProject.tasks.named('aggregate')

        // IMPORTANTE: el task "test" corre en un JVM FORKEADO, distinto del
        // JVM de Gradle. Las propiedades "-D" pasadas por línea de comandos
        // (./gradlew test -Dapi.base.url=...) SOLO llegan al JVM de Gradle;
        // no se reenvían solas al JVM forkeado del test. Hay que reenviarlas
        // explícitamente, si no, el código siempre usa su valor por defecto
        // (System.getProperty(x, "default")) sin importar qué -D se pase.
        def forwardedProperties = [
                'api.base.url', 'ui.base.url',
                'playwright.headless', 'playwright.browser'
        ]
        forwardedProperties.each { key ->
            def value = System.getProperty(key)
            if (value != null) {
                systemProperty key, value
            }
        }
    }
}
