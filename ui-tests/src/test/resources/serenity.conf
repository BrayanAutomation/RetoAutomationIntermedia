serenity {
  project.name = "Reto Automation - UI Tests"
  take.screenshots = AFTER_EACH_STEP
  report.encoding = utf8
  logging = VERBOSE
}

environments {
  default = "local"
  local {
    webdriver.base.url = "http://localhost:3000"
  }
  docker {
    webdriver.base.url = "http://frontend"
  }
}

feature {
  file.encoding = utf8
}
